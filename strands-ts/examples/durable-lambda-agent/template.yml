AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Strands agent running with AWS Lambda durable execution

Parameters:
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-6
    Description: Bedrock model or inference profile ID available in the deployment region
  FunctionName:
    Type: String
    Default: strands-durable-agent

Resources:
  DurableAgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DurableExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:CheckpointDurableExecution
                  - lambda:GetDurableExecutionState
                Resource: '*'
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

  DurableAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      CodeUri: ./dist
      Handler: handler.lambdaHandler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt DurableAgentRole.Arn
      DurableConfig:
        ExecutionTimeout: 300
        RetentionPeriodInDays: 7
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
    Metadata:
      SkipBuild: true

Outputs:
  FunctionName:
    Description: Deployed durable Lambda function name
    Value: !Ref DurableAgentFunction
  FunctionArn:
    Description: Deployed durable Lambda function ARN
    Value: !GetAtt DurableAgentFunction.Arn
